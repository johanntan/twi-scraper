[project]
name = "twi"
version = "0.1.0"
description = "Download The Wandering Inn chapters as clean Markdown or EPUB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.scripts]
twi = "twi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
