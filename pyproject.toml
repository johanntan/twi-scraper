[project]
name = "twi-scraper"
version = "0.1.1"
description = "Download The Wandering Inn web serial as clean, screen-reader-friendly Markdown or EPUB."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johann", email = "johann@jtan.me" }]
requires-python = ">=3.11"
keywords = ["wandering inn", "web serial", "epub", "markdown", "accessibility", "screen reader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/johanntan/twi-scraper"
Source = "https://github.com/johanntan/twi-scraper"
Issues = "https://github.com/johanntan/twi-scraper/issues"

[project.scripts]
twi = "twi.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twi"]

[tool.hatch.build.targets.sdist]
exclude = ["CLAUDE.md", ".github", "uv.lock", "out"]

[tool.pytest.ini_options]
testpaths = ["tests"]
