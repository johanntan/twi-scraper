[project]
name = "twi-epub"
version = "0.1.0"
description = "Personal-use Wandering Inn volume downloader"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "browser-cookie3>=0.20.1",
    "click>=8.1.8",
    "ebooklib>=0.19",
    "httpx>=0.28.1",
    "lxml>=5.4.0",
    "markdownify>=1.1.0",
]

[project.scripts]
twi-epub = "twi_epub.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
indent-style = "tab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
