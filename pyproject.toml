[project]
name = "twi-scraper"
version = "0.2.0"
description = "Build personal Markdown and EPUB archives from The Wandering Inn"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Johann", email = "johann@jtan.me" },
]
keywords = ["ebook", "epub", "markdown", "scraper", "wandering-inn", "web-serial"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "browser-cookie3>=0.20.1",
    "click>=8.1.8",
    "ebooklib>=0.19",
    "httpx>=0.28.1",
    "lxml>=5.4.0",
    "markdownify>=1.1.0",
]

[project.scripts]
twi = "twi_scraper.cli:app"

[project.urls]
Homepage = "https://github.com/johanntan/twi-scraper"
Issues = "https://github.com/johanntan/twi-scraper/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
indent-style = "tab"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
